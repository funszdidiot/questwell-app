version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: questwell-dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /tool/ci
    target-branch: questwell-dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pub
    directory: /
    target-branch: questwell-dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
