name: issue6-polished-assets review proposal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  propose:
    if: github.ref == 'refs/heads/questwell-dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked tools without lifecycle scripts
        run: npm ci --ignore-scripts --prefix tool/ci
      - name: Generate isolated review proposal
        env:
          NODE_PATH: ${{ github.workspace }}/tool/ci/node_modules
        run: node tool/generate_issue6_polished_assets.cjs
      - name: Package only the expected changes for PR review
        run: node tool/ci/asset-proposal.cjs issue6-polished-assets
      - name: Retain proposal for reviewed PR intake
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue6-polished-assets-${{ github.sha }}
          path: ${{ runner.temp }}/questwell-asset-proposal
          retention-days: 7
          if-no-files-found: error
