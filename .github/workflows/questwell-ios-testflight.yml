name: Questwell iOS signing and optional TestFlight upload

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed questwell-dev commit (40 lowercase hex characters)
        required: true
        type: string
      build_number:
        description: Unused Apple build number, e.g. 1.0.1 (N.N.N)
        required: true
        type: string
      upload_to_testflight:
        description: Upload to Apple only after native review and exact-source approval
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: questwell-ios-signing
  cancel-in-progress: false

jobs:
  quality:
    if: github.ref == 'refs/heads/questwell-dev' && inputs.source_sha == github.sha
    uses: ./.github/workflows/questwell-flutter-check.yml

  archive:
    needs: quality
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/questwell-dev' && inputs.source_sha == github.sha
    runs-on: macos-15
    timeout-minutes: 45
    environment: ios-testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      IOS_SOURCE_SHA: ${{ inputs.source_sha }}
      IOS_BUILD_NUMBER: ${{ inputs.build_number }}
      IOS_SIGNING_ENABLED: ${{ vars.IOS_SIGNING_ENABLED }}
      IOS_UPLOAD_REQUESTED: ${{ inputs.upload_to_testflight }}
      IOS_UPLOAD_APPROVED_SHA: ${{ vars.IOS_UPLOAD_APPROVED_SHA }}
    steps:
      - name: Checkout exact dispatch revision without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate trusted dispatch and registered identity
        run: |
          npm ci --ignore-scripts --prefix tool/ci
          git diff --exit-code -- tool/ci/package.json tool/ci/package-lock.json
          python3 -c 'from tool.ci.ios_testflight import validate_request; import os; validate_request(os.environ)'
          python3 tool/qa/ios_identity_test.py
          python3 tool/qa/ios_testflight_test.py
          python3 tool/qa/ios_upload_test.py
          python3 -m tool.ci.ios_upload --check-request
      - name: Set up pinned Flutter
        uses: ./.github/actions/flutter
        with:
          flutter-version: '3.44.6'
      - name: Install locked Dart dependencies before exposing signing secrets
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Sign and validate archive and export without uploading
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: python3 tool/ci/ios_testflight.py
      - name: Validate and upload reviewed IPA to Apple when explicitly selected
        if: inputs.upload_to_testflight
        env:
          ASC_API_KEY_ID: ${{ vars.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ vars.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: python3 -m tool.ci.ios_upload
      - name: Retain only sanitized validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-signing-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ios-signing-evidence/validation.json
            build/ios-signing-evidence/Podfile.lock
            build/ios-signing-evidence/native-review.json
            build/ios-signing-evidence/altool-help.txt
            build/ios-signing-evidence/apple-delivery.json
          if-no-files-found: warn
          retention-days: 7
