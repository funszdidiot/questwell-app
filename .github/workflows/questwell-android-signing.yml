name: Questwell Android signing

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/flutter
        with:
          flutter-version: '3.44.6'
      - name: Require a credential-free fixture
        run: |
          test ! -e android/key.properties
          node --test tool/qa/android_signing_test.mjs
          flutter pub get --enforce-lockfile
      - name: Compile Android app without release credentials
        run: flutter build apk --debug --target lib/main.dart --dart-define=QUESTWELL_ENVIRONMENT=isolated_test
      - name: Release signing must reject absent credentials
        shell: bash
        run: |
          set +e
          flutter build apk --release --target lib/main.dart --dart-define=QUESTWELL_ENVIRONMENT=isolated_test > "$RUNNER_TEMP/signing-validation.log" 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo 'Release signing unexpectedly accepted missing credentials'
            exit 1
          fi
          if ! grep -F 'Questwell release signing requires complete private android/key.properties credentials.' "$RUNNER_TEMP/signing-validation.log"; then
            cat "$RUNNER_TEMP/signing-validation.log"
            echo 'Failure was not the expected missing release keystore'
            exit 1
          fi
      - name: Preserve dependency inputs
        run: git diff --exit-code -- pubspec.yaml pubspec.lock
