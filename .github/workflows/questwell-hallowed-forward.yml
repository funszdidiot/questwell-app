name: Reviewed Halloween forward migration

on:
  pull_request:
    branches: [questwell-dev]
  push:
    branches: [deploy/hallowed-hearth-approved]

permissions:
  contents: read

concurrency:
  group: questwell-reviewed-hallowed-forward
  cancel-in-progress: false

jobs:
  guards:
    name: Halloween deployment guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate exact release sources and failure paths without credentials
        run: |
          node --test tool/qa/hallowed_forward_test.mjs
          node tool/deploy/hallowed-hearth.mjs --check

  apply:
    name: Activate only the reviewed Halloween collection
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy/hallowed-hearth-approved'
    needs: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout the reviewed revision without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify served client and atomically activate the exact release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUESTWELL_HALLOWED_MIGRATION_TOKEN: ${{ secrets.QUESTWELL_HALLOWED_MIGRATION_TOKEN }}
        run: node tool/deploy/hallowed-hearth.mjs
