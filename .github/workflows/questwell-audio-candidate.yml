name: Questwell Audio Candidate
on:
  pull_request:
    branches: [questwell-dev]
permissions:
  contents: read
jobs:
  candidate:
    if: github.head_ref == 'feat/questwell-beta-music-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/flutter
        with:
          flutter-version: '3.44.6'
      - name: Verify locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Focused audio regression tests
        run: flutter test --dart-define=QUESTWELL_ENVIRONMENT=isolated_test test/questwell_audio_test.dart
      - name: Analyze audio files
        run: dart analyze lib/services/questwell_audio.dart lib/services/questwell_audio_player.dart lib/widgets/questwell_audio_controls.dart lib/preview/audio_review.dart test/questwell_audio_test.dart
      - name: Audio controls in Chrome
        run: flutter test --dart-define=QUESTWELL_ENVIRONMENT=isolated_test --platform chrome test/questwell_audio_test.dart
