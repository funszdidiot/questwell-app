name: Neutral Woodland Repair

on:
  push:
    branches:
      - questwell-dev
    paths:
      - tool/repair_neutral_woodland_v3.cjs
      - .github/workflows/neutral-woodland-repair.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: questwell-dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image dependency
        run: npm install --no-save --ignore-scripts=false sharp

      - name: Generate repaired neutral Woodland candidate
        run: node tool/repair_neutral_woodland_v3.cjs

      - name: Verify only expected candidate changed
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/images/questwell/avatar/woodland_scout_unified_neutral_v3.webp
          changed="$(git status --porcelain | awk '{print $2}')"
          unexpected="$(printf '%s\n' "$changed" | grep -v '^assets/images/questwell/avatar/woodland_scout_unified_neutral_v3.webp$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated changes:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/images/questwell/avatar/woodland_scout_unified_neutral_v3.webp              && ! git ls-files --others --exclude-standard | grep -q '^assets/images/questwell/avatar/woodland_scout_unified_neutral_v3.webp$'; then
            echo "Candidate already current."
            exit 0
          fi
          git config user.name "questwell-production-agent"
          git config user.email "actions@users.noreply.github.com"
          git add assets/images/questwell/avatar/woodland_scout_unified_neutral_v3.webp
          git commit -m "Generate neutral Woodland Scout v3 fit repair"
          git push origin HEAD:questwell-dev
