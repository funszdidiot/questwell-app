name: neutral-woodland-repair review proposal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  propose:
    if: github.ref == 'refs/heads/questwell-dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked tools without lifecycle scripts
        run: npm ci --ignore-scripts --prefix tool/ci
      - name: Generate isolated review proposal
        env:
          NODE_PATH: ${{ github.workspace }}/tool/ci/node_modules
        run: node tool/repair_neutral_woodland_v3.cjs
      - name: Package only the expected changes for PR review
        run: node tool/ci/asset-proposal.cjs neutral-woodland-repair
      - name: Retain proposal for reviewed PR intake
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neutral-woodland-repair-${{ github.sha }}
          path: ${{ runner.temp }}/questwell-asset-proposal
          retention-days: 7
          if-no-files-found: error
