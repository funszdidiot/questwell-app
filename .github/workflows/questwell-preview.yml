name: Questwell Preview

on:
  push:
    branches:
      - questwell-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: questwell-preview
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/questwell-flutter-check.yml

  build:
    permissions:
      contents: read
      pages: read
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/flutter
        with:
          flutter-version: '3.44.6'

      - name: Install locked dependencies
        shell: bash
        run: |
          git ls-files --error-unmatch pubspec.lock
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock

      # Includes the CPU-only CanvasKit image fix (flutter/flutter#180706).
      - name: Build preview
        run: flutter build web --release --dart-define=QUESTWELL_ENVIRONMENT=live_beta --target lib/main_preview.dart --base-href "/questwell-app/" --pwa-strategy=none --dart-define=QUESTWELL_BUILD="$GITHUB_SHA"

      - name: Verify build preserved dependency inputs
        run: git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Cache-bust preview bundle
        run: |
          sed -i "s#main.dart.js#main.dart.js?rev=${GITHUB_SHA}#g" build/web/index.html
          sed -i "s#manifest.json#manifest.json?rev=${GITHUB_SHA}#g" build/web/index.html
          sed -i "s#__QUESTWELL_BUILD__#${GITHUB_SHA}#g" build/web/index.html build/web/production-dashboard.html
          python3 -c 'import json, os, pathlib; pathlib.Path("build/web/questwell-version.json").write_text(json.dumps({"revision": os.environ["GITHUB_SHA"]}))'
          ! grep -q '__QUESTWELL_BUILD__' build/web/index.html build/web/production-dashboard.html

      - name: Add SPA fallback
        run: cp build/web/index.html build/web/404.html

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      # Equivalent Linux tar layout required by deploy-pages; avoid the
      # upstream composite's mutable nested upload-artifact reference.
      - name: Archive preview
        run: tar --dereference --hard-dereference --directory build/web --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/artifact.tar" .

      - name: Upload preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/questwell-dev'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
