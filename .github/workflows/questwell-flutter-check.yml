name: Questwell Flutter Check

on:
  pull_request:
    branches:
      - flutterflow
  push:
    branches:
      - questwell-dev

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify approved and candidate class assets
        run: python3 tool/verify_avatar_assets.py

      - name: Test preview update handling
        run: node --test tool/qa/preview_updates_test.cjs tool/qa/delete_account_test.mjs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test class underlayer coverage and alignment
        run: flutter test test/auth_flow_test.dart test/questwell_network_test.dart test/delete_account_test.dart test/cosmetic_sync_test.dart test/mastery_relic_test.dart test/new_quest_form_test.dart test/app_navigation_test.dart test/mobile_layout_test.dart test/expedition_scene_test.dart test/boss_board_test.dart test/boss_entrance_test.dart test/cosmetic_effect_test.dart test/wanderer_cuffs_test.dart test/pathfinder_boots_test.dart test/grimoire_grip_test.dart test/cloak_test.dart test/familiar_test.dart test/market_equipment_test.dart test/chronicle_journal_test.dart test/starlit_orrery_test.dart test/milestone_roadmap_test.dart test/first_journey_test.dart test/questwell_progression_test.dart test/hearth_polish_test.dart test/side_wall_art_test.dart test/wall_art_test.dart test/reading_table_test.dart test/reading_chair_test.dart test/room_picker_test.dart test/bookshelf_test.dart test/scholar_underlayer_clip_test.dart test/scout_underlayer_clip_test.dart test/alchemist_underlayer_clip_test.dart test/guardian_underlayer_clip_test.dart test/robe_wrap_test.dart test/wanderer_underlayer_clip_test.dart test/hearth_integration_test.dart test/quest_board_card_test.dart test/home_sections_test.dart test/campfire_background_test.dart test/home_overview_test.dart test/adventurer_view_test.dart



