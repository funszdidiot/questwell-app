name: Questwell Flutter Check

on:
  pull_request:
    branches:
      - flutterflow
      - questwell-dev
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install locked workflow validation tools
        run: |
          npm ci --ignore-scripts --prefix tool/ci
          git diff --exit-code -- tool/ci/package.json tool/ci/package-lock.json
      - name: Enforce workflow supply-chain policy
        run: |
          node --test tool/qa/workflow_security_test.cjs
          node tool/ci/workflow-security.cjs

      - name: Verify registered iOS identity
        run: python3 tool/qa/ios_identity_test.py

      - name: Test iOS signing preparation without credentials
        run: python3 tool/qa/ios_testflight_test.py

      - name: Verify staging packaging isolation
        run: python3 tool/qa/staging_package_test.py

      - name: Verify approved and candidate class assets
        run: python3 tool/verify_avatar_assets.py

      - name: Test preview updates, account deletion and repository protection
        run: node --test tool/qa/data_policy_test.mjs tool/qa/preview_updates_test.cjs tool/qa/delete_account_test.mjs tool/qa/repository_ignore_test.cjs tool/qa/android_signing_test.mjs

      - name: Validate seasonal release standards
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('docs/questwell-production/SEASONAL_RELEASE_MANIFEST.schema.json','utf8'))"
          node tool/validate_seasonal_release_manifest.cjs docs/questwell-production/SEASONAL_RELEASE_MANIFEST.example.json --structure-only
          node tool/validate_seasonal_release_manifest.cjs assets/jsons/seasonal_review_fixture.json
          node tool/validate_seasonal_release_manifest.cjs docs/releases/hallowed-hearth-2026/manifest.proposed.json
          node tool/validate_seasonal_release_manifest.cjs assets/jsons/hallowed_hearth_decor_2026.json
          node tool/validate_seasonal_release_manifest.cjs docs/releases/autumn-hearth-2026/manifest.json
          node --test tool/qa/seasonal_manifest_test.cjs


      - name: Set up Flutter
        uses: ./.github/actions/flutter
        with:
          flutter-version: '3.44.6'

      - name: Install locked dependencies
        shell: bash
        run: |
          git ls-files --error-unmatch pubspec.lock
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock
          sha256sum pubspec.lock

      - name: Verify locked resolution with an empty package cache
        shell: bash
        env:
          PUB_CACHE: ${{ runner.temp }}/questwell-empty-pub-cache
        run: |
          test ! -e "$PUB_CACHE"
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock
          sha256sum pubspec.lock

      - name: Test quality gate failure detection
        run: |
          python3 -m unittest discover -s tool/qa -p quality_gate_test.py -v

      - name: Enforce analyzer and formatting baseline
        run: python3 tool/quality_gate.py

      - name: Run complete Flutter regression suite
        run: flutter test --dart-define=QUESTWELL_ENVIRONMENT=isolated_test

      - name: Verify gated Hearth decorator
        run: flutter test --dart-define=QUESTWELL_ENVIRONMENT=isolated_test --dart-define=QUESTWELL_DECORATE_HEARTH=true test/decorate_hearth_test.dart test/hearth_layout_contract_test.dart test/hearth_composition_test.dart

      - name: Retain Hearth composition review images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hearth-composition-${{ github.sha }}
          path: build/hearth-composition/
          retention-days: 7
          if-no-files-found: warn

      - name: Retain avatar and familiar magic review images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: magic-review-${{ github.sha }}
          path: build/magic-review/
          retention-days: 7
          if-no-files-found: warn

      - name: Retain rendered Halloween review images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hallowed-review-${{ github.sha }}
          path: build/hallowed-review/
          retention-days: 7
          if-no-files-found: warn

      - name: Verify paging and account navigation in Chrome
        run: flutter test --dart-define=QUESTWELL_ENVIRONMENT=isolated_test --platform chrome test/open_task_list_test.dart test/boss_list_test.dart test/account_settings_test.dart test/chronicle_history_test.dart test/chronicle_server_totals_test.dart test/client_service_adapters_test.dart test/completion_refresh_test.dart test/feedback_account_isolation_test.dart test/auth_catalog_adapters_test.dart test/questwell_network_test.dart test/staging_navigation_test.dart test/questwell_audio_test.dart

      - name: Build proposed development app without deploying
        if: github.event_name == 'pull_request'
        run: flutter build web --release --dart-define=QUESTWELL_ENVIRONMENT=live_beta --dart-define=QUESTWELL_DECORATE_HEARTH=true --target lib/main_monitored_preview.dart --base-href "/questwell-app/" --pwa-strategy=none --dart-define=QUESTWELL_BUILD="$GITHUB_SHA"

      - name: Compile and package staging without telemetry
        run: |
          flutter build web --release --dart-define=QUESTWELL_ENVIRONMENT=staging --target lib/main_monitored_preview.dart --base-href "/questwell-app/staging/" --output=build/staging --pwa-strategy=none --dart-define=QUESTWELL_BUILD="$GITHUB_SHA"
          python3 tool/package_staging.py

      - name: Test staging artifact validation
        run: python3 -m unittest discover -s tool/qa -p staging_artifact_test.py -v

      - name: Retain staging candidate for acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: questwell-staging-${{ github.sha }}
          path: build/staging/
          retention-days: 7
          if-no-files-found: error

      - name: Verify checks and builds preserved dependency inputs
        run: git diff --exit-code -- pubspec.yaml pubspec.lock

  critical-coverage:
    name: Critical client coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without shared test build state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pinned Flutter
        uses: ./.github/actions/flutter
        with:
          flutter-version: '3.44.6'
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test coverage report failure detection
        run: python3 -m unittest discover -s tool/qa -p coverage_report_test.py -v
      - name: Measure critical client coverage separately
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # Isolate the pinned VM coverage collector between test files. A shared
          # collection session can crash after otherwise successful tests.
          mkdir -p coverage/parts
          reports=()
          for test_file in \
            test/open_task_list_test.dart test/boss_list_test.dart \
            test/boss_creation_recovery_test.dart test/purchase_recovery_test.dart \
            test/delete_account_test.dart test/auth_flow_test.dart \
            test/questwell_network_test.dart test/startup_bootstrap_test.dart \
            test/widget_test.dart test/client_service_adapters_test.dart \
            test/auth_catalog_adapters_test.dart test/feedback_account_isolation_test.dart; do
            report="coverage/parts/$(basename "$test_file" .dart).info"
            flutter test --dart-define=QUESTWELL_ENVIRONMENT=isolated_test \
              --coverage --branch-coverage --concurrency=1 \
              --coverage-path="$report" "$test_file"
            test -s "$report"
            reports+=("$report")
          done
          # The existing parser merges repeated source coordinates without
          # inflating denominators. Never report partial or stale collections.
          cat "${reports[@]}" > coverage/lcov.info

      - name: Report critical client coverage
        run: |
          python3 tool/critical_coverage.py coverage/lcov.info --flutter-lcov --output coverage/critical-paths
          cat coverage/critical-paths.md >> "$GITHUB_STEP_SUMMARY"

      - name: Retain coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: critical-client-coverage-${{ github.sha }}
          path: |
            coverage/lcov.info
            coverage/critical-paths.json
            coverage/critical-paths.md
          if-no-files-found: error
          retention-days: 7

      - name: Preserve dependency inputs
        run: git diff --exit-code -- pubspec.yaml pubspec.lock

  android:
    uses: ./.github/workflows/questwell-android-signing.yml

  ios:
    name: iOS unsigned release compile
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pinned Flutter
        uses: ./.github/actions/flutter
        with:
          flutter-version: '3.44.6'
      - name: Verify pinned Apple upload toolchain
        shell: bash
        run: |
          test -d "$DEVELOPER_DIR"
          xcode_version="$(xcodebuild -version)"
          ios_sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          printf '%s\niOS SDK %s\n' "$xcode_version" "$ios_sdk_version"
          test "$xcode_version" = $'Xcode 26.3\nBuild version 17C529'
          test "$ios_sdk_version" = '26.2'
      - name: Record remaining native toolchain
        run: |
          pod --version
          flutter --version
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Compile iOS release without signing or distribution
        run: flutter build ios --release --no-codesign --target lib/main.dart --dart-define=QUESTWELL_ENVIRONMENT=isolated_test
      - name: Preserve dependency inputs
        run: git diff --exit-code -- pubspec.yaml pubspec.lock
