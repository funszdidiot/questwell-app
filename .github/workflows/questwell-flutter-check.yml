name: Questwell Flutter Check

on:
  pull_request:
    branches:
      - flutterflow
  push:
    branches:
      - questwell-dev

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify approved and candidate class assets
        run: python3 tool/verify_avatar_assets.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test class underlayer coverage and alignment
        run: flutter test test/scholar_underlayer_clip_test.dart test/scout_underlayer_clip_test.dart test/alchemist_underlayer_clip_test.dart test/guardian_underlayer_clip_test.dart test/robe_wrap_test.dart test/wanderer_underlayer_clip_test.dart test/hearth_integration_test.dart test/quest_board_card_test.dart test/home_sections_test.dart
