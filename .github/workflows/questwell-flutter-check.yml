name: Questwell Flutter Check

on:
  pull_request:
    branches:
      - flutterflow
      - questwell-dev
  workflow_call:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify approved and candidate class assets
        run: python3 tool/verify_avatar_assets.py

      - name: Test preview updates, account deletion and repository protection
        run: node --test tool/qa/preview_updates_test.cjs tool/qa/delete_account_test.mjs tool/qa/repository_ignore_test.cjs

      - name: Validate seasonal release standards
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('docs/questwell-production/SEASONAL_RELEASE_MANIFEST.schema.json','utf8'))"
          node tool/validate_seasonal_release_manifest.cjs docs/questwell-production/SEASONAL_RELEASE_MANIFEST.example.json --structure-only


      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Characterize the existing resolver before committing its exact output.
      # This temporary capture is replaced by strict enforcement in this PR.
      - name: Capture dependency resolution for review
        shell: bash
        run: |
          mkdir -p .dart_tool/questwell-dependency-evidence
          cp pubspec.lock .dart_tool/questwell-dependency-evidence/pubspec.lock
          flutter --version --machine > .dart_tool/questwell-dependency-evidence/flutter-version.json
          flutter pub get --help
          flutter pub deps --json > .dart_tool/questwell-dependency-evidence/dependencies.json
          sha256sum pubspec.yaml pubspec.lock
          git diff --exit-code -- pubspec.yaml

      - name: Preserve the generated dependency evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: questwell-dependency-baseline
          path: .dart_tool/questwell-dependency-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Require the application lockfile in version control
        run: git ls-files --error-unmatch pubspec.lock

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run all substantive Flutter regressions
        shell: bash
        run: |
          # This generated counter placeholder has no assertion and does not
          # initialize the application's backend. Every real regression is
          # discovered automatically, including future tests in subdirectories.
          mapfile -d '' tests < <(find test -type f -name '*_test.dart' ! -path 'test/widget_test.dart' -print0)
          test "${#tests[@]}" -gt 0
          flutter test "${tests[@]}"

      - name: Build proposed development app without deploying
        if: github.event_name == 'pull_request' && github.base_ref == 'questwell-dev'
        run: flutter build web --release --target lib/main_preview.dart --base-href "/questwell-app/" --pwa-strategy=none --dart-define=QUESTWELL_BUILD="$GITHUB_SHA"
