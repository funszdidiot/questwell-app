name: Questwell Flutter Check

on:
  pull_request:
    branches:
      - flutterflow
  push:
    branches:
      - questwell-dev

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify fitted Scholar assets
        run: python3 tool/verify_avatar_assets.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test Scholar underlayer coverage and alignment
        run: flutter test test/scholar_underlayer_clip_test.dart
