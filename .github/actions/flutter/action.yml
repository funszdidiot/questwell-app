name: Pinned Flutter with pinned caches
description: Preserve the SDK setup while bypassing mutable nested cache actions.
inputs:
  flutter-version:
    required: true
    description: Exact reviewed Flutter release
runs:
  using: composite
  steps:
    - name: Resolve SDK paths
      id: paths
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        dry-run: true
        cache: false
        pub-cache: false
    - name: Cache SDK
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.paths.outputs.CACHE-PATH }}
        key: questwell-flutter-${{ runner.os }}-${{ runner.arch }}-${{ inputs.flutter-version }}-v1
    - name: Cache locked packages
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.paths.outputs.PUB-CACHE-PATH }}
        key: questwell-pub-${{ runner.os }}-${{ runner.arch }}-${{ inputs.flutter-version }}-${{ hashFiles('pubspec.lock') }}-v1
    - name: Install SDK
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        cache: false
        pub-cache: false
