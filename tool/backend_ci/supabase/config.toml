# Disposable CI fixture stack only. Never link this directory to a hosted project.
# Fields verified against CLI 2.119.0's generated config and current official docs.
project_id = "questwell-disposable-ci"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "1MiB"

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
# Synthetic @example.test accounts only. This is NOT live email/auth configuration.
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
