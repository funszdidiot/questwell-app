  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.0

dependency_overrides:
  http: 1.4.0
  rxdart: 0.27.7
  uuid: ^4.0.0

dev_dependencies:
  flutter_lints: 4.0.0
  lints: 4.0.0
  flutter_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  fonts:
    - family: HearthSerif
      fonts:
        - asset: assets/fonts/DejaVuSerif-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/questwell/avatar/
    - assets/images/questwell/avatar/base/
    - assets/images/questwell/avatar/halloween_v1/midnight_masquerade/female/
    - assets/images/questwell/avatar/halloween_v1/midnight_masquerade/neutral/
    - assets/images/questwell/avatar/halloween_v1/midnight_masquerade/male/
    - assets/images/questwell/avatar/halloween_v1/pumpkin_court/female/
    - assets/images/questwell/avatar/halloween_v1/pumpkin_court/neutral/
    - assets/images/questwell/avatar/halloween_v1/pumpkin_court/male/
    - assets/images/questwell/avatar/classes/scholar/
    - assets/images/questwell/avatar/classes/scout/
    - assets/images/questwell/avatar/classes/alchemist/
    - assets/images/questwell/avatar/classes/guardian/
    - assets/images/questwell/avatar/classes/wanderer/
    - assets/images/questwell/hearth/
    - assets/images/questwell/hearth/mastery/
    - assets/videos/
